<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1f2a3a"/>
      <stop offset="60%"  stop-color="#121821"/>
      <stop offset="100%" stop-color="#0a0e15"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f97316"/>
      <stop offset="55%"  stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="55%" r="50%">
      <stop offset="0%"   stop-color="#ef4444" stop-opacity="0.30"/>
      <stop offset="50%"  stop-color="#ef4444" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#halo)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
  </g>

  <!-- faux macOS menu bar -->
  <g>
    <rect x="80" y="60" width="1120" height="56" rx="12"
          fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
    <!-- left items -->
    <circle cx="108" cy="88" r="6" fill="#ffffff" fill-opacity="0.85"/>
    <text x="135" y="94" fill="#cdd3e1"
          font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600">Finder</text>
    <text x="200" y="94" fill="#9ca3af"
          font-family="-apple-system, system-ui, sans-serif" font-size="14">File</text>
    <text x="240" y="94" fill="#9ca3af"
          font-family="-apple-system, system-ui, sans-serif" font-size="14">Edit</text>
    <text x="280" y="94" fill="#9ca3af"
          font-family="-apple-system, system-ui, sans-serif" font-size="14">View</text>

    <!-- StockBar live ticker (center-right of menu bar) -->
    <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="14">
      <text x="540" y="94" fill="#e6e8ee">NI225      38,250</text>
      <text x="725" y="94" fill="#ef4444">     +120     +0.31%</text>
      <text x="925" y="94" fill="#9ca3af">  |  </text>
      <text x="965" y="94" fill="#e6e8ee">BTC/USD   62,345.78</text>
    </g>

    <!-- right items -->
    <text x="1160" y="94" fill="#9ca3af"
          font-family="-apple-system, system-ui, sans-serif" font-size="14">14:32</text>
  </g>

  <!-- hero title -->
  <g text-anchor="middle">
    <text x="640" y="320" fill="#ffffff"
          font-family="Hiragino Sans, 'Yu Gothic', system-ui, sans-serif"
          font-weight="900" font-size="100" letter-spacing="-2">
      仕事の集中力低下に
    </text>
    <text x="640" y="440" fill="url(#up)"
          font-family="Hiragino Sans, 'Yu Gothic', system-ui, sans-serif"
          font-weight="900" font-size="120" letter-spacing="-2"
          filter="url(#glow)">
      最適！
    </text>
  </g>

  <!-- subtitle -->
  <text x="640" y="500" text-anchor="middle" fill="#9ca3af"
        font-family="Hiragino Sans, 'Yu Gothic', system-ui, sans-serif"
        font-size="22" font-weight="500">
    macOS のメニューバーに 株価 / 指数 / 為替 / 暗号資産 をローテーション表示
  </text>

  <!-- rising chart accent (bottom left) -->
  <g fill="none" stroke="url(#up)" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <polyline points="100,580 180,520 240,545 340,440"/>
    <polyline points="295,440 340,440 340,485"/>
  </g>
  <g fill="#ffffff">
    <circle cx="100" cy="580" r="6"/>
    <circle cx="180" cy="520" r="6"/>
    <circle cx="240" cy="545" r="6"/>
    <circle cx="340" cy="440" r="7"/>
  </g>

  <!-- StockBar wordmark (bottom right) -->
  <g transform="translate(1090, 560)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#0a0e15" stroke="rgba(255,255,255,0.15)"/>
    <g fill="none" stroke="url(#up)" stroke-width="4"
       stroke-linecap="round" stroke-linejoin="round" transform="translate(0,0)">
      <polyline points="10,38 19,28 26,32 40,16"/>
    </g>
    <text x="65" y="33" fill="#ffffff"
          font-family="-apple-system, system-ui, sans-serif"
          font-weight="700" font-size="28">StockBar</text>
  </g>
</svg>
