<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1f2a3a"/>
      <stop offset="100%" stop-color="#0a0e15"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"  stop-color="#f97316"/>
      <stop offset="55%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <g fill="none" stroke="url(#line)" stroke-width="56"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <polyline points="180,720 384,500 560,612 820,300"/>
    <polyline points="630,300 820,300 820,490"/>
  </g>

  <g fill="#ffffff">
    <circle cx="180" cy="720" r="20"/>
    <circle cx="384" cy="500" r="20"/>
    <circle cx="560" cy="612" r="20"/>
    <circle cx="820" cy="300" r="24"/>
  </g>
</svg>
